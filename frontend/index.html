<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - CyberTrust</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    body {
      background: #ffffff;
      min-height: 100vh;
    }
    
    .login-card {
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 102, 204, 0.15);
      border: 2px solid #0066CC;
    }
    
    .input-field {
      transition: all 0.2s ease;
      border: 2px solid #e5e7eb;
      background: #ffffff;
    }
    
    .input-field:hover {
      border-color: #0066CC;
    }
    
    .input-field:focus {
      border-color: #0066CC;
      box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
      outline: none;
    }
    
    .btn-primary {
      background: #0066CC;
      transition: all 0.2s ease;
    }
    
    .btn-primary:hover {
      background: #0052A3;
      box-shadow: 0 8px 16px rgba(0, 102, 204, 0.3);
      transform: translateY(-2px);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .icon-container {
      background: #0066CC;
      border: 2px solid #0066CC;
    }
    
    .cybertrust-text {
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      color: #0066CC;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 102, 204, 0.3);
    }
    
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    
    .slide-up {
      animation: slideUp 0.4s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message {
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Logo EPITA en haut à gauche -->
  <div class="absolute top-6 left-6">
    <img src="https://www.epita.fr/wp-content/uploads/2022/03/logo-epita-2021.svg" 
         alt="EPITA" 
         class="h-10 md:h-12"
         onerror="this.style.display='none'">
  </div>
  
  <!-- Header CyberTrust -->
  <div class="absolute top-6 left-0 right-0 flex items-center justify-center">
    <div class="text-center">
      <h2 class="cybertrust-text text-xl md:text-2xl">CyberTrust</h2>
      <p class="text-slate-500 text-xs uppercase tracking-wider mt-1">Security Platform</p>
    </div>
  </div>
  
  <div class="login-card rounded-xl p-8 md:p-10 w-full max-w-md fade-in slide-up">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <div class="inline-block p-4 icon-container rounded-xl mb-6">
        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">Connexion</h1>
      <p class="text-slate-600 text-sm">Accédez à votre espace sécurisé</p>
    </div>

    <!-- Formulaire -->
    <form id="loginForm" class="space-y-6">
      <div class="space-y-2">
        <label for="username" class="block text-sm font-semibold text-slate-800">
          Nom d'utilisateur
        </label>
        <input 
          type="text" 
          id="username" 
          name="username"
          autocomplete="username"
          placeholder="Entrez votre nom d'utilisateur"
          required
          class="input-field w-full px-4 py-3 rounded-lg text-slate-900 placeholder-slate-400 text-sm font-medium"
        />
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-sm font-semibold text-slate-800">
          Mot de passe
        </label>
        <input 
          type="password" 
          id="password" 
          name="password"
          autocomplete="current-password"
          placeholder="Entrez votre mot de passe"
          required
          class="input-field w-full px-4 py-3 rounded-lg text-slate-900 placeholder-slate-400 text-sm font-medium"
        />
      </div>

      <button 
        type="submit" 
        class="btn-primary w-full py-3.5 rounded-lg text-white font-bold text-base mt-8"
      >
        Se connecter
      </button>
    </form>

    <!-- Message -->
    <div id="message" class="mt-6 text-center text-sm font-medium message hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
