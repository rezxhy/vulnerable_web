<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Vulnérable - Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
    input { display: block; width: 100%; margin: 10px 0; padding: 10px; }
    button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; cursor: pointer; }
    button:hover { background: #0052a3; }
    #message { margin-top: 15px; color: #d00; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Connexion</h1>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Nom d'utilisateur" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <button type="submit">Se connecter</button>
  </form>
  <p id="message"></p>

  <script src="script.js"></script>
</body>
</html>
